name: astrbot_plugin_cortico_bridge
display_name: Coo 桥控制台
short_desc: 通过 AstrBot 原生机器人实例接入 Coo
desc: >-
  读取 AstrBot 的机器人实例，按实例设置主人私聊、安全模式、完整模式和会话权限。通过原生事件转发消息，
  引用、图片、语音和主动发送能力由适配器决定。
version: 1.3.13
author: as124da1231
repo: https://github.com/as124da1231/astrbot_plugin_cortico_bridge
entry: main.py
license: MIT
astrbot_version: ">=4.29.1"
tags:
  - bridge
  - agent
  - cortico
help: >-
  在 Coo 安装同版本的 cortico-world-astrbot。同机默认使用 ws://127.0.0.1:17999。
  跨机可在 Coo 的「连接」页填写 ws:// 或 wss:// 地址和一枚桥接令牌。
  在 AstrBot 的 Coo 桥控制台选择实例并设置主人、模式和会话范围。
