name: astrbot_plugin_cortico_bridge
display_name: Cortico 桥
short_desc: 让 Cortico 的 Persona 在 QQ 群和私聊里说话，AstrBot 只当手脚 / Bridge QQ groups and private chats to a Cortico persona while AstrBot handles plugins
desc: >-
  把 AstrBot 的 QQ 群聊和私聊接到 Cortico。支持点名唤醒、图片、语音转写、语音回复和通知。AstrBot 管理接管范围与工具授权，Coo 本地对话借用主人身份时须使用独立工具令牌。
  / Bridge QQ conversations to a Cortico persona. AstrBot maintains connections, accounts, and plugins while Cortico decides what to say; supports groups and private chats, mention/all scopes, images (native or vision-described), speech-to-text and TTS replies, notices, and owner-scoped tool calls from the Coo chat.
version: 1.3.7
author: as124da1231
repo: https://github.com/as124da1231/astrbot_plugin_cortico_bridge
entry: main.py
license: MIT
astrbot_version: ">=4.29.1"
support_platforms:
  - aiocqhttp
tags:
  - bridge
  - agent
  - cortico
help: >-
  同机部署保持 listen_host=127.0.0.1、token 留空即可；跨机再把 listen_host 改成 0.0.0.0 并设置 token。
  再到 Cortico 侧装配套扩展 cortico-world-astrbot，填同一个 ws://<地址>:17999 和 token。
  插件详情页的「控制台」分「概览 / 群聊 / 私聊 / 工具 / 语音」：看连接与流水、管理群聊和私聊范围、给 Coo 授权工具、开关语音并试听。
