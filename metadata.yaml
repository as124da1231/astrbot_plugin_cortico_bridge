name: astrbot_plugin_cortico_bridge
display_name: Cortico 桥
short_desc: 让 Cortico 的 Persona 在 QQ 群和私聊里说话，AstrBot 只当手脚 / Bridge QQ groups and private chats to a Cortico persona while AstrBot handles plugins
desc: >-
  把 AstrBot 的 QQ 群聊和私聊接到 Coo。支持引用、合并转发、图片、按需读取语音原文件、语音转写和语音回复。AstrBot 管理接管范围与工具授权。
  / Bridges QQ groups and private chats to Coo, with quotes, merged forwards, images, on-demand voice files, transcription, and voice replies.
version: 1.3.9
author: as124da1231
repo: https://github.com/as124da1231/astrbot_plugin_cortico_bridge
entry: main.py
license: MIT
astrbot_version: ">=4.29.1"
support_platforms:
  - aiocqhttp
tags:
  - bridge
  - agent
  - cortico
help: >-
  同机部署可使用 ws://127.0.0.1:17999。跨机使用 wss:// 地址并设置桥接令牌。
  在 Coo 安装同版本的 cortico-world-astrbot，于「连接」页填写地址与桥接令牌。
  插件详情页的「控制台」分「概览 / 群聊 / 私聊 / 工具 / 语音」：看连接与流水、管理群聊和私聊范围、给 Coo 授权工具、开关语音并试听。
