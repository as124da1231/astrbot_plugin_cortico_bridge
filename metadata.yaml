name: astrbot_plugin_cortico_bridge
display_name: Coo 桥控制台
short_desc: 通过 AstrBot 将 QQ 和 Discord 接入 Coo / Connect QQ and Discord to Coo through AstrBot
desc: >-
  把 AstrBot 的 QQ 群聊和私聊、获准的 Discord 频道和主人私聊接到 Coo。QQ 支持引用、合并转发、图片、按需读取语音原文件、语音转写和语音回复。AstrBot 管理接管范围与工具授权。
  / Bridges QQ groups and private chats, plus approved Discord channels and owner DMs, to Coo. QQ supports quotes, merged forwards, images, and voice.
version: 1.3.11
author: as124da1231
repo: https://github.com/as124da1231/astrbot_plugin_cortico_bridge
entry: main.py
license: MIT
astrbot_version: ">=4.29.1"
support_platforms:
  - aiocqhttp
  - discord
tags:
  - bridge
  - agent
  - cortico
help: >-
  在 Coo 安装同版本的 cortico-world-astrbot。同机默认使用 ws://127.0.0.1:17999。
  跨机可在 Coo 的「连接」页填写 ws:// 或 wss:// 地址和一枚桥接令牌。
  主人 QQ、完整模式审批、群聊和私聊范围、工具及语音都在 AstrBot 桥插件里管理。
